name: daily-concerts
on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests beautifulsoup4 python-dateutil pytz
      - name: Find main.py
        id: find_main
        shell: bash
        run: |
          set -e
          F="$(git ls-files | grep -E '(^|/)(main\.py)$' | head -n1 || true)"
          if [ -z "$F" ]; then
            echo "MAIN=" >> $GITHUB_OUTPUT
            echo "main.py not found"; exit 1
          else
            echo "MAIN=$F" >> $GITHUB_OUTPUT
            echo "Found: $F"
          fi
      - name: Run agent
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FORCE_SEND_NOW: ${{ secrets.FORCE_SEND_NOW }}
        run: python "${{ steps.find_main.outputs.MAIN }}"
