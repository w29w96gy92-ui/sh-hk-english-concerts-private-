name: daily-concerts
on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: List repo
        run: |
          pwd
          git branch --show-current || true
          ls -la
          find . -maxdepth 2 -type f -print
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests beautifulsoup4 python-dateutil pytz
      - name: Run agent
        run: python ./main.py
