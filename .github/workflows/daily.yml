name: daily-concerts
on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: List repo
        run: |
          pwd
          ls -la
          ls -la .github || true
          ls -la .github/workflows || true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run agent
        run: python main.py
